[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/llmeval"]
data_file = "reports/.coverage"

[tool.coverage.xml]
output = "reports/coverage.xml"
