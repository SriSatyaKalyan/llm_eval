name: LLM Evaluation CIon:  push:    branches: [main]  pull_request:    branches: [main]  schedule:    - cron: '0 6 * * 1'env:  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Fix Node.js 20 deprecation warningsjobs:  evaluate:    runs-on: ubuntu-latest    steps:      - uses: actions/checkout@v4      - name: Set up Python        uses: actions/setup-python@v5        with:          python-version: '3.11'      - name: Install dependencies        run: |          pip install --upgrade pip          pip install pytest pytest-html  # Ensure these are present even if missing from requirements.txt          pip install -r requirements.txt      - name: Run fast metrics (no API call)        run: pytest tests/test_context_precision.py -v --tb=short      - name: Run evaluation suite with HTML report        env:          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}        run: |          mkdir -p reports          pytest tests/ \            -v --tb=short \            --ignore=tests/test_dataset_generation.py \            --html=reports/eval_report.html \            --self-contained-html        if: always()      - name: Upload report artifact        uses: actions/upload-artifact@v4        with:          name: evaluation-report          path: reports/eval_report.html        if: always()