name: LLM Evaluation CIon:  push:    branches: [main]  pull_request:    branches: [main]  schedule:    - cron: '0 6 * * 1'  # Weekly regression run (Monday 6am)jobs:  evaluate:    runs-on: ubuntu-latest    steps:      - uses: actions/checkout@v4      - name: Set up Python        uses: actions/setup-python@v5        with:          python-version: '3.11'      - name: Install dependencies        run: pip install -r requirements.txt      - name: Run fast metrics (no API call)        run: pytest tests/test_context_precision.py -v --tb=short      - name: Run evaluation suite        env:          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}        run: pytest tests/ -v --tb=short --ignore=tests/test_dataset_generation.py      - name: Generate HTML report        run: pytest tests/ --html=reports/eval_report.html --self-contained-html        if: always()      - name: Upload report artifact        uses: actions/upload-artifact@v4        with:          name: evaluation-report          path: reports/eval_report.html        if: always()