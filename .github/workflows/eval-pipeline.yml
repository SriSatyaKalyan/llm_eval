name: LLM Evaluation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      run_all_tests:
        description: 'Run the full evaluation suite (all tests)?'
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov coverage-badge

      - name: Patch ragas VertexAI import
        # ragas.llms.base unconditionally imports ChatVertexAI from
        # langchain_community.chat_models.vertexai, which was removed in
        # langchain-community 0.3.0. This stub satisfies that import.
        # ChatVertexAI is never called — the project uses Anthropic.
        run: |
          python - <<'PYEOF'
          import site, os
          for sp in site.getsitepackages():
              stub_dir = os.path.join(sp, 'langchain_community', 'chat_models')
              if os.path.isdir(stub_dir):
                  stub_path = os.path.join(stub_dir, 'vertexai.py')
                  with open(stub_path, 'w') as f:
                      f.write('class ChatVertexAI:\n    pass\n')
                  print(f'Stub created at {stub_path}')
                  break
          else:
              print('WARNING: langchain_community not found in site-packages')
          PYEOF

      - name: Run context precision test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p reports
          pytest tests/test_context_precision.py \
            -v --tb=short \
            --html=reports/eval_report.html \
            --self-contained-html

      - name: Run full evaluation suite
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_all_tests == true }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p reports
          pytest tests/ \
            -v --tb=short \
            --ignore=tests/test_dataset_generation.py \
            --html=reports/eval_report.html \
            --self-contained-html

      - name: Generate coverage badge
        if: github.ref == 'refs/heads/main'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p reports
          pytest --cov=src/llmeval --cov-report=xml -q --ignore=tests/test_dataset_generation.py || true
          coverage-badge -o coverage.svg -f

      - name: Commit coverage badge
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add coverage.svg
          git diff --cached --quiet || git commit -m "chore: update coverage badge [skip ci]"
          git push

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: reports/eval_report.html
        if: always()
